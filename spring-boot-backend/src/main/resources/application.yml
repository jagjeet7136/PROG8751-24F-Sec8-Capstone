server:
  port: 9898

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL5Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  output:
    ansi:
      enabled: ALWAYS
  redis:
    host: localhost
    port: 7000
    connect-timeout: 1s
    timeout: 1s

security:
    jwt:
      secret: ${JWT_SECRET}

stripe:
  api-key: ${STRIPE_API_KEY}
  webhook-key: ${STRIPE_WEBHOOK_KEY}

app:
  cache:
    enabled: true

mailjet:
  api-key: ${MAILJET_API_KEY}
  secret-key: ${MAILJET_SECRET_KEY}
  sender:
    email: jagjeet7136@gmail.com
    name: Shopee

logging:
  level:
    root: INFO
    com.app.ecommerce: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG

application:
  title: ecommerce-backend
  version: 1.0.0

frontend:
  origin: http://localhost:3000